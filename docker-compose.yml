services:
  postgres:
    image: postgres:17-alpine
    container_name: gestion-inventario-db
    environment:
      POSTGRES_DB: gestion_inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_inventario"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  inventory_data:
